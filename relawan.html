<style>
.stepper{display:flex;align-items:center;gap:0;margin:16px 0}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;font-size:12px;font-weight:700;color:var(--s-400)}
.stepper .st i{width:30px;height:30px;border-radius:50%;background:var(--s-200);display:grid;place-items:center;font-style:normal;color:#fff;z-index:1;transition:.3s}
.stepper .st::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:3px;background:var(--s-200)}
.stepper .st:first-child::before{display:none}
.stepper .st.on{color:var(--navy)}.stepper .st.on i{background:var(--coral)}.stepper .st.on::before{background:var(--coral)}
.stepper .st.done i{background:var(--teal)}.stepper .st.done::before{background:var(--teal)}
.stk{display:flex;flex-direction:column;gap:6px}
.newb{animation:pulse 1.2s ease-in-out 3}
.inv-bar{height:8px;width:120px;border-radius:9px;background:var(--s-100);overflow:hidden}.inv-bar i{display:block;height:100%;border-radius:9px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>
</head>

<script>window.NProgress && NProgress.start();</script>
